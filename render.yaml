services:
  - type: web
    name: trading-screener
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SEC_USER_AGENT
        sync: false   # set in the Render dashboard, e.g.  Aayush Kamdar you@example.com  (SEC requires name + email)
